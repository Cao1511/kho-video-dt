name: Lam video Duc Thanh
on:
  push:
    branches: [video]
    paths: ['video-jobs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lam-video
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: video
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bo nho dem thu vien + mo hinh tach tieng
        uses: actions/cache@v4
        with:
          path: |
            ~/venv
            ~/.cache/uvr
          key: video-${{ runner.os }}-${{ hashFiles('_tools/requirements-video.txt') }}-v3
      - name: Cai ffmpeg + thu vien
        run: |
          if [ ! -x ~/venv/bin/python ]; then python -m venv ~/venv && ~/venv/bin/pip install -q -r _tools/requirements-video.txt; fi
          if [ ! -x ~/venv/bin/ffmpeg ]; then
            curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C /tmp
            cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe ~/venv/bin/
          fi
          ~/venv/bin/ffmpeg -version | head -1
      - name: Dung video
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_KEY: ${{ secrets.SHEET_KEY }}
        run: PATH=~/venv/bin:$PATH ~/venv/bin/python _tools/video_runner.py
      - name: Luu ket qua
        if: always()
        run: |
          git config user.name "lam-video-bot"
          git config user.email "lam-video-bot@users.noreply.github.com"
          git add -A video video-goc video-jobs video-results
          git diff --cached --quiet && exit 0
          git commit -m "Ket qua lam video"
          for i in 1 2 3 4; do git pull --rebase origin video && git push origin HEAD:video && break; sleep 4; done
